name: Keep Render Backend Alive

on:
  schedule:
    # Run every 5 minutes to prevent Render free-tier sleep (15 min inactivity timeout)
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render backend health endpoint
        run: |
          curl --fail --silent --show-error --location \
            --max-time 60 \
            --retry 3 \
            --retry-delay 5 \
            https://esports-arena-906z.onrender.com/api/v1/public/ping
