name: Keep Render Backend Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render backend
        run: |
          curl --fail --silent --show-error --location \
            --max-time 30 \
            --retry 3 \
            --retry-delay 5 \
            https://esports-arena-906z.onrender.com/
